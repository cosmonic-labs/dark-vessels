# wasmCloud v2 deployment manifest for dark-vessels.
#
# ONE WorkloadDeployment, ONE component: the sar-processor image serves the
# UI and the detection API behind the async `wasi:http/handler@0.3.0` (P3)
# export, and runs CA-CFAR ship detection on the GPU via
# `wasi:webgpu@0.3.0-rc.2`. Detection lives behind the ASYNC http export
# because the runtime declares the webgpu acquisition/map functions
# `async func` — a sync-lifted export (like the messaging handler) cannot
# await them. The `wasmcloud:messaging` surface is retained as a CPU-only
# compatibility trigger on subject "tasks.sar-processor".
#
# Requires wasmCloud >= v2.6.1 (wasi:webgpu@0.3.0-rc.2 + P3 HTTP), with:
#   - the wasmCloud chart installed with --set
#     runtime.hostGroups[0].webgpu.enabled=true (passes --wasi-webgpu
#     to the host)
#   - a node with a usable GPU and the necessary device passthrough
#
# See README.md ("Deploying to Kubernetes") for full installation
# steps and for the CPU-only deployment alternative on hosts without
# WebGPU support.
#
# Ingress: the wasmCloud runtime-gateway routes by Host header to the
# component declaring a matching wasi:http config.host value. Test with:
#   curl -H 'Host: dark-vessels.localhost.direct' http://localhost/
#
# Apply with: kubectl apply -f deploy/wasmcloud/workloaddeployment.yaml
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: dark-vessels
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - handler
          config:
            host: dark-vessels.localhost.direct
        - namespace: wasi
          package: webgpu
          version: 0.3.0-rc.2
          interfaces:
            - webgpu
        - namespace: wasmcloud
          package: messaging
          version: "0.2.0"
          interfaces:
            - handler
            - consumer
            - types
          config:
            subscriptions: tasks.sar-processor
      components:
        - name: dark-vessels
          image: ghcr.io/cosmonic-labs/dark-vessels/sar-processor:0.2.0
          poolSize: 1
          localResources:
            allowedHosts:
              - "https://dataspace.copernicus.eu"
              - "https://www.aishub.net"
