# Cosmonic Control HTTPTrigger for API gateway for dark-vessels.
#
# The api-gateway serves a single-file SPA that loads resources from several
# external origins. Outbound access from the component is scoped to those
# hosts via localResources.allowedHosts:
#   - unpkg.com              MapLibre GL JS CSS + JS bundle
#   - tile.openstreetmap.org  Raster map tiles
#   - nominatim.openstreetmap.org  Geocoding / location search
#   - dataspace.copernicus.eu  CDSE OAuth + Sentinel-1 SAR imagery (optional)
#   - www.aishub.net         Live AIS vessel feed (optional)
apiVersion: control.cosmonic.io/v1alpha1
kind: HTTPTrigger
metadata:
  name: dv-apigateway
  namespace: cosmonic-system
spec:
  ingress:
    host: darkvessels.localhost.cosmonic.sh
    paths:
      - pathType: Prefix
        path: /
  timeout: 300s
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: logging
          version: 0.1.0-draft
          interfaces:
            - logging
        - namespace: wasmcloud
          package: messaging
          version: "0.2.0"
          interfaces:
            - consumer
            - types
      components:
        - name: api-gateway
          image: ghcr.io/cosmonic-labs/dark-vessels/api-gateway:0.1.0
          localResources:
            allowedHosts:
              - "https://dataspace.copernicus.eu"
              - "https://www.aishub.net"
---
# Cosmonic Control WorkloadDeployment for the SAR processor for dark-vessels.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: dv-sarproc
  namespace: cosmonic-system
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: logging
          version: 0.1.0-draft
          interfaces:
            - logging
        - namespace: wasi
          package: webgpu
          version: 0.0.1
          interfaces:
            - webgpu
        - namespace: wasmcloud
          package: messaging
          version: "0.2.0"
          interfaces:
            - handler
            - consumer
            - types
          config:
            subscriptions: tasks.sar-processor
      components:
        - name: sar-processor
          image: ghcr.io/cosmonic-labs/dark-vessels/sar-processor:0.1.0
          poolSize: 1
