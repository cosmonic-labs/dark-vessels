# Cosmonic Control HTTPTrigger for dark-vessels.
#
# ONE trigger, ONE component: the sar-processor image serves the SPA and the
# detection API behind the async `wasi:http/handler@0.3.0` export and runs
# CA-CFAR on the GPU via `wasi:webgpu@0.3.0-rc.2` (requires wasmCloud >=
# v2.6.1 and a webgpu-enabled host group). The messaging surface remains as
# a CPU-only compatibility trigger.
#
# The SPA loads resources from several external origins; outbound access is
# scoped via localResources.allowedHosts:
#   - dataspace.copernicus.eu  CDSE OAuth + Sentinel-1 SAR imagery (optional)
#   - www.aishub.net           Live AIS vessel feed (optional)
# (unpkg.com / openstreetmap tiles are fetched by the BROWSER, not the
# component, and need no allowedHosts entries.)
apiVersion: control.cosmonic.io/v1alpha1
kind: HTTPTrigger
metadata:
  name: dark-vessels
  namespace: cosmonic-system
spec:
  ingress:
    host: darkvessels.localhost.cosmonic.sh
    paths:
      - pathType: Prefix
        path: /
  timeout: 300s
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: logging
          version: 0.1.0-draft
          interfaces:
            - logging
        - namespace: wasi
          package: webgpu
          version: 0.3.0-rc.2
          interfaces:
            - webgpu
        - namespace: wasmcloud
          package: messaging
          version: "0.2.0"
          interfaces:
            - handler
            - consumer
            - types
          config:
            subscriptions: tasks.sar-processor
      components:
        - name: dark-vessels
          image: ghcr.io/cosmonic-labs/dark-vessels/sar-processor:0.2.0
          poolSize: 1
          localResources:
            allowedHosts:
              - "https://dataspace.copernicus.eu"
              - "https://www.aishub.net"
