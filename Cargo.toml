[workspace]
resolver = "3"
package.edition = "2024"
package.authors = ["Arcade"]
members = ["api-gateway", "sar-processor"]

[workspace.dependencies]
# 0.59 with the async features: wasi:webgpu@0.3.0-rc.2 (wasmCloud >= 2.6)
# declares request-adapter/request-device/map-async as `async func`, and this
# is the version wash-runtime's own http-webgpu fixture builds against.
wit-bindgen = { version = "0.59.0", features = ["async-spawn", "inter-task-wakeup"] }
wstd = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
